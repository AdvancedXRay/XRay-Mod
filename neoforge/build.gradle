plugins {
    id 'net.neoforged.moddev'
}

neoForge {
    version = project.neoforge_version
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        // applies to all the run configs below
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(":common").sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Optional/soft dependency - only used to register our outline pipeline with Iris's shader
    // compatibility layer when Iris is present. Never required at runtime.
    compileOnly "maven.modrinth:iris:${project.iris_version}+${project.minecraft_version}-neoforge"
}

repositories {
    maven {
        url "https://maven.neoforged.net/releases"
    }
    maven {
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

java {
    withSourcesJar()
}
